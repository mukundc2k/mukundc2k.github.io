- name: >-
    <br>hi! i am a 3rd year PhD student in NLP @ <a href="https://mbzuai.ac.ae/">MBZUAI</a> advised by <a href="https://scholar.google.com/citations?user=WR1ImCMAAAAJ&hl=en">Monojit Choudhury</a>, comparing how LLMs structure language to how humans do. i call it <b>inductive linguistic behavioral interpretability</b> of LLMs, or <b>LLM linguistics</b> on a casual day.

