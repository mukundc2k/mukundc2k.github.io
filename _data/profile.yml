short_bio: >-
  over the last two years, i've been cornering LLMs with controlled linguistic contrasts, watching how they behave, and working backwards to which distinctions they show, ignore, or get stumped by. so far that's been
  <b>(1)</b> what makes <b>linguistics olympiad puzzles</b> tricky for them (<a href="https://openreview.net/forum?id=fcRcl1EXc4">COLM, 2025</a>),
  <b>(2)</b> whether they model <b>human linguistic variation</b> in Hindi-English verb code-mixing (<a href="https://doi.org/10.18653/v1/2026.findings-eacl.291">EACL, 2026</a>),
  <b>(3)</b> how they process <b>hierarchical sequences</b> compared to crows, monkeys, children, and adults (<a href="https://escholarship.org/uc/item/92x8p24r">CogSci abstract, 2026</a>; journal version cooking),
  <b>(4)</b> a <b>taxonomy of translation difficulty</b> for the <a href="https://arxiv.org/abs/2609.04173">Last Translation Benchmark</a>, and
  <b>(5)</b> whether LMs make <b>second-language learner</b>-like mistakes across development (WIP).
  next up: a survey stitching these together, and <b>neurodivergence x AI</b>.<br><br>
  before this i completed my <b>MSc. in Computational Linguistics</b> at IIIT Hyderabad. linguistic complexity and how tech models it, was also the theme for my masters thesis on <b>pseudowords generation</b> (e.g. for LLM subword probes) and <b>native speaker evaluation design</b> in low-resource languages. this theme started inspiring me since i was a high schooler (in raipur, chhattisgarh), solving actual linguistic reasoning puzzles for fun, reading <a href="https://www.goodreads.com/book/show/588362.An_Introduction_to_Language">Fromkin</a>, watching <a href="https://www.youtube.com/channel/UCByBOwwOU5tKddYpsrHiUUw">Xidnaf</a>, and being active on <a href="https://linguistics.stackexchange.com/users/wiccankarnak">linguistics stackexchange</a> all on my own, and then spreading the passion for this around in my city all on my own.<br><br>
  everything fun i've worked on, is slotted below in the grid inspired by my thesis: rows go from <b>linguistics</b>-heavy to <b>cognition</b>-heavy work, and columns from <b>controlled</b> stimuli to <b>naturalistic</b> data.
  <span class="st-done">greens are done</span>, <span class="st-doing">purples are happening</span>, <span class="st-next">blues are just starting off, <b>join in!</b></span> if a cell makes you go "huh?", that's on purpose, ask me :)
